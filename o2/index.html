<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Oscillator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow-x: hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #000;
  color: #111;
}

body { display: flex; flex-direction: column; }

.header {
  background: white;
  padding: 12px 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  z-index: 10;
}

h1 { font-size: 1.1rem; text-align: center; margin-bottom: 12px; }

.controls {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
}

.volume-container {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  max-width: 200px;
}

.btn {
  width: 48px;
  height: 40px;
  border: 1px solid #111;
  background: #111;
  color: white;
  cursor: pointer;
  font-size: 16px;
  touch-action: manipulation;
}

.btn:active { background: white; color: #111; }
.btn.on { background: #444; border-color: #444; }

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 14px;
  overflow-y: auto;
}

.section {
  background: white;
  border: 1px solid #eee;
  border-radius: 4px;
}

/* Frequency section is always visible, no pointer cursor */
.section-fixed {
  background: white;
  border: 1px solid #eee;
  border-radius: 4px;
  padding: 12px;
}

.section-label {
  padding: 8px 0 12px;
  text-align: center;
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
}

.section-header {
  padding: 14px;
  text-align: center;
  cursor: pointer;
  user-select: none;
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
}

.section-content {
  display: none;
  padding: 12px;
  border-top: 1px solid #f9f9f9;
}

.section.open .section-content { display: block; }

.param-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.param-label { width: 70px; font-size: 0.85rem; }
.param-slider { flex: 1; accent-color: #111; cursor: pointer; }

.number-input {
  width: 60px;
  height: 34px;
  border: 1px solid #111;
  text-align: center;
  font-family: monospace;
}

/* Custom Waveform Selector Styling */
.waveform-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}

.wave-btn {
  padding: 10px;
  border: 1px solid #111;
  background: white;
  cursor: pointer;
  font-size: 0.75rem;
  text-transform: uppercase;
  font-weight: bold;
}

.wave-btn.active {
  background: #111;
  color: white;
}

.toggle {
  width: 70px;
  height: 34px;
  border: 1px solid #111;
  background: #111;
  color: white;
  cursor: pointer;
}

.toggle.off { background: white; color: #111; }

.site-footer { padding: 20px; text-align: center; }
.site-footer a { color: white; text-decoration: none; font-size: 0.8rem; opacity: 0.6; }

@media (min-width: 700px) {
  body { max-width: 500px; margin: 0 auto; border-left: 1px solid #333; border-right: 1px solid #333; }
}
</style>
</head>

<body>

<div class="header">
  <h1>Oscillator</h1>
  <div class="controls">
    <button id="btn-play" class="btn">▶</button>
    <button id="btn-stop" class="btn">■</button>
    <div class="volume-container">
      <span style="font-size: 10px; font-weight: bold;">VOL</span>
      <input id="master-vol" type="range" class="param-slider" min="0" max="1" step="0.01" value="0.5">
    </div>
  </div>
</div>

<div class="main">
  <div class="section-fixed">
    <div class="section-label">Frequency</div>
    <div class="param-row">
      <button id="freq-minus" class="btn">−</button>
      <input id="freq-slider" type="range" class="param-slider" min="20" max="2000" step="1" value="440" />
      <button id="freq-plus" class="btn">+</button>
      <input id="freq-input" class="number-input" type="number" value="440" />
    </div>
  </div>

  <div class="section">
    <div class="section-header">Waveform</div>
    <div class="section-content">
      <div class="waveform-grid">
        <button class="wave-btn active" data-value="sine">Sine</button>
        <button class="wave-btn" data-value="square">Square</button>
        <button class="wave-btn" data-value="triangle">Triangle</button>
        <button class="wave-btn" data-value="sawtooth">Sawtooth</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">EQ</div>
    <div class="section-content">
      <div class="param-row"><div class="param-label">Low</div><input id="eq-low" type="range" min="-12" max="12" step="0.1" class="param-slider" value="0"></div>
      <div class="param-row"><div class="param-label">Mid</div><input id="eq-mid" type="range" min="-12" max="12" step="0.1" class="param-slider" value="0"></div>
      <div class="param-row"><div class="param-label">High</div><input id="eq-high" type="range" min="-12" max="12" step="0.1" class="param-slider" value="0"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">LFO</div>
    <div class="section-content">
      <div class="param-row">
        <div class="param-label">Enable</div>
        <button id="lfo-toggle" class="toggle off">OFF</button>
      </div>
      <div class="param-row"><div class="param-label">Rate</div><input id="lfo-rate" type="range" min="0.1" max="20" step="0.1" class="param-slider" value="5"></div>
      <div class="param-row"><div class="param-label">Depth</div><input id="lfo-depth" type="range" min="0" max="1000" step="1" class="param-slider" value="100"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">Effects</div>
    <div class="section-content">
      <div class="param-row"><div class="param-label">Delay</div><input id="delay-time" type="range" min="0" max="1" step="0.01" class="param-slider" value="0"></div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <a href="https://jordanelias.de" target="_blank">jordanelias.de</a>
</footer>

<script>
let ctx, osc, masterGain, lowFilter, midFilter, highFilter;
let lfo, lfoGain, delayNode, delayGain;
let playing = false;
let lfoEnabled = false;
let currentWaveform = 'sine';

function initAudio() {
    if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Setup Filter Chain
        lowFilter = ctx.createBiquadFilter();
        lowFilter.type = "lowshelf";
        lowFilter.frequency.value = 200;

        midFilter = ctx.createBiquadFilter();
        midFilter.type = "peaking";
        midFilter.frequency.value = 1000;

        highFilter = ctx.createBiquadFilter();
        highFilter.type = "highshelf";
        highFilter.frequency.value = 3000;

        delayNode = ctx.createDelay(2.0);
        delayGain = ctx.createGain();
        delayGain.gain.value = 0;

        masterGain = ctx.createGain();
        masterGain.gain.value = 0;

        // Routing
        lowFilter.connect(midFilter);
        midFilter.connect(highFilter);
        highFilter.connect(masterGain);
        masterGain.connect(ctx.destination);
        
        // Delay loop
        masterGain.connect(delayNode);
        delayNode.connect(delayGain);
        delayGain.connect(masterGain);

        // LFO setup
        lfo = ctx.createOscillator();
        lfoGain = ctx.createGain();
        lfoGain.gain.value = 0; 
        lfo.connect(lfoGain);
        lfo.start();
    }
    if (ctx.state === 'suspended') ctx.resume();
}

function startOsc() {
    initAudio();
    if (playing) return;

    osc = ctx.createOscillator();
    osc.type = currentWaveform;
    osc.frequency.value = Number(document.getElementById("freq-input").value);
    
    // Connect LFO to oscillator frequency
    lfoGain.disconnect();
    if (lfoEnabled) lfoGain.connect(osc.frequency);

    osc.connect(lowFilter);
    osc.start();

    const vol = document.getElementById("master-vol").value;
    masterGain.gain.setTargetAtTime(vol, ctx.currentTime, 0.05); // Smooth fade in

    document.getElementById("btn-play").classList.add("on");
    playing = true;
}

function stopOsc() {
    if (!playing) return;
    masterGain.gain.setTargetAtTime(0, ctx.currentTime, 0.05); // Smooth fade out

    setTimeout(() => {
        if (osc) {
            osc.stop();
            osc.disconnect();
        }
        playing = false;
        document.getElementById("btn-play").classList.remove("on");
    }, 150);
}

// Frequency Controls
const freqSlider = document.getElementById("freq-slider");
const freqInput = document.getElementById("freq-input");
function updateFreq(v) {
    v = Math.min(2000, Math.max(20, v));
    freqSlider.value = v;
    freqInput.value = v;
    if (osc) osc.frequency.setTargetAtTime(v, ctx.currentTime, 0.01);
}
freqSlider.oninput = (e) => updateFreq(e.target.value);
freqInput.onchange = (e) => updateFreq(e.target.value);
document.getElementById("freq-minus").onclick = () => updateFreq(Number(freqInput.value) - 1);
document.getElementById("freq-plus").onclick = () => updateFreq(Number(freqInput.value) + 1);

// Waveform Selector
document.querySelectorAll('.wave-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.wave-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentWaveform = btn.dataset.value;
        if (osc) osc.type = currentWaveform;
    };
});

// Real-time EQ
document.getElementById("eq-low").oninput = (e) => { if(lowFilter) lowFilter.gain.setTargetAtTime(e.target.value, ctx.currentTime, 0.01); };
document.getElementById("eq-mid").oninput = (e) => { if(midFilter) midFilter.gain.setTargetAtTime(e.target.value, ctx.currentTime, 0.01); };
document.getElementById("eq-high").oninput = (e) => { if(highFilter) highFilter.gain.setTargetAtTime(e.target.value, ctx.currentTime, 0.01); };

// Real-time LFO
document.getElementById("lfo-rate").oninput = (e) => { if(lfo) lfo.frequency.setTargetAtTime(e.target.value, ctx.currentTime, 0.01); };
document.getElementById("lfo-depth").oninput = (e) => { if(lfoGain) lfoGain.gain.setTargetAtTime(e.target.value, ctx.currentTime, 0.01); };
document.getElementById("lfo-toggle").onclick = (e) => {
    lfoEnabled = !lfoEnabled;
    e.target.textContent = lfoEnabled ? "ON" : "OFF";
    e.target.classList.toggle("off", !lfoEnabled);
    if (playing && osc) {
        if (lfoEnabled) lfoGain.connect(osc.frequency);
        else lfoGain.disconnect();
    }
};

// Real-time Volume & Effects
document.getElementById("master-vol").oninput = (e) => {
    if (playing && masterGain) masterGain.gain.setTargetAtTime(e.target.value, ctx.currentTime, 0.02);
};
document.getElementById("delay-time").oninput = (e) => {
    if (delayGain) delayGain.gain.setTargetAtTime(e.target.value, ctx.currentTime, 0.01);
    if (delayNode) delayNode.delayTime.setTargetAtTime(0.3, ctx.currentTime, 0.01); 
};

// Accordion
document.querySelectorAll(".section-header").forEach(h => {
    h.onclick = () => h.parentElement.classList.toggle("open");
});

document.getElementById("btn-play").onclick = startOsc;
document.getElementById("btn-stop").onclick = stopOsc;
</script>
</body>
</html>
