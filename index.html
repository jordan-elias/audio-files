<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Audio Clips</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
      padding: 12px 14px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      text-align: center;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      border: 1px solid #111;
      border-radius: 0;
      padding: 0;
      cursor: pointer;
      background: #111;
      color: white;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 36px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active {
      background: white;
      color: #111;
    }
    .btn:disabled { opacity: 0.35; cursor: default; }

    .now-playing {
      flex: 1;
      font-size: 0.85rem;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* Progress bar — pure black on white, no grey */
    .progress-wrap {
      height: 4px;
      background: white;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #111;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px 24px;
    }

    .loading-indicator {
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      color: #aaa;
    }

    ul { list-style: none; }

    li {
      padding: 14px 12px;
      margin-bottom: 8px;
      background: white;
      border-radius: 0;
      border: 1px solid #eee;
      cursor: pointer;
      font-size: 1rem;
      text-align: center;
      user-select: none;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transform: none;
      -webkit-transform: none;
    }
    li:active { background: #f0f0f0; transform: none; }
    li:hover  { background: #f7f7f7; }
    li.active { border-color: #111; font-weight: 600; }
    li.loading::after { content: ' ⏳'; font-size: 0.8rem; }

    @media (min-width: 700px) {
      body {
        max-width: 600px;
        margin: 0 auto;
        border-left: 1px solid #eee;
        border-right: 1px solid #eee;
      }
    }

    /* ── Tap-to-load overlay ─────────────────────────────────────────────── */
    #overlay {
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #overlay h2 {
      color: white;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    #overlay-btn {
      background: white;
      color: #111;
      border: none;
      border-radius: 0;
      padding: 14px 32px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.03em;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #overlay-warning {
      color: #888;
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.6;
      max-width: 240px;
    }  
    #overlay-status {
      color: #888;
      font-size: 0.8rem;
      min-height: 1.2em;
    }
    </style>
</head>
<body>
  <div id="overlay">
    <h2>Audio Clips</h2>
    <p id="overlay-warning">If your phone is on silent, audio will not play.<br>Please put your phone on do not disturb, switch your ringer on, and turn your volume all the way up before continuing.</p>
    <button id="overlay-btn">Tap to load sounds</button>
    <span id="overlay-status"></span>
  </div>

  <div class="header">
    <h1>Audio Clips</h1>
    <div class="controls">
      <button class="btn" id="btn-play-pause" disabled aria-label="Play / Pause">
        <svg id="icon-play"  width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <svg id="icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="btn" id="btn-stop" disabled aria-label="Stop">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16"/></svg>
      </button>
      <span class="now-playing" id="now-playing"></span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <div class="list-container">
    <ul id="clip-list"></ul>
  </div>

  <script>
    const clips = [
      { label: '1', file: 'audio/1.mp3' },
      { label: '2', file: 'audio/2.mp3' },
      { label: '3', file: 'audio/3.mp3' },
      { label: '4', file: 'audio/4.mp3' },
      { label: '5', file: 'audio/5.mp3' },
      { label: '6', file: 'audio/6.mp3' },
      { label: '7', file: 'audio/7.mp3' },
      { label: '8', file: 'audio/8.mp3' },
    ];

    const FADE_IN  = 0.04;
    const FADE_OUT = 0.04;
    const MIN_GAIN = 0.0001;

    // ── AudioContext ──────────────────────────────────────────────────────────
    // Created immediately; iOS will keep it suspended until we play a real
    // buffer inside the overlay tap (the warmup below).
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx      = new AudioCtx();

    // Master gain node — all clips route through this for fades
    const masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(1, ctx.currentTime);
    masterGain.connect(ctx.destination);

    // ── Decoded buffer cache ──────────────────────────────────────────────────
    const buffers = {};  // file -> AudioBuffer

    // ── State ─────────────────────────────────────────────────────────────────
    let activeSource = null;   // currently playing BufferSourceNode
    let activeMeta   = null;   // { file, label, startedAt, duration }
    let isPaused     = false;
    let pauseOffset  = 0;
    let fadeTimer    = null;
    let progressRaf  = null;

    // ── UI refs ───────────────────────────────────────────────────────────────
    const overlay       = document.getElementById('overlay');
    const overlayBtn    = document.getElementById('overlay-btn');
    const overlayStatus = document.getElementById('overlay-status');
    const btnPlayPause  = document.getElementById('btn-play-pause');
    const btnStop       = document.getElementById('btn-stop');
    const nowPlaying    = document.getElementById('now-playing');
    const progressBar   = document.getElementById('progress-bar');
    const clipList      = document.getElementById('clip-list');
    const iconPlay      = document.getElementById('icon-play');
    const iconPause     = document.getElementById('icon-pause');

    function showPlay()  { iconPlay.style.display = '';     iconPause.style.display = 'none'; }
    function showPause() { iconPlay.style.display = 'none'; iconPause.style.display = ''; }

    // ── Build clip list ───────────────────────────────────────────────────────
    clips.forEach(({ label, file }) => {
      const li = document.createElement('li');
      li.textContent = label;
      li.dataset.file = file;
      li.addEventListener('click', () => onClipTap(file, label, li));
      clipList.appendChild(li);
    });

    // ── iOS warmup — play a silent buffer to truly unlock audio output ─────────
    // Must be called synchronously inside a user gesture.
    function warmup() {
      ctx.resume();
      const silent = ctx.createBuffer(1, 1, ctx.sampleRate);
      const src    = ctx.createBufferSource();
      src.buffer   = silent;
      src.connect(ctx.destination);
      src.start(0);
    }

    // ── Overlay tap: unlock → fetch → decode → dismiss ────────────────────────
    overlay.addEventListener('click', async () => {
      // Step 1: warmup synchronously (must be in same call stack as gesture)
      warmup();

      overlayBtn.textContent    = 'Loading…';
      overlayBtn.disabled       = true;
      overlayStatus.textContent = '';

      // Step 2: fetch all files in parallel
      let loaded = 0;
      const results = await Promise.allSettled(clips.map(async ({ file }) => {
        const res    = await fetch(file);
        const arrBuf = await res.arrayBuffer();
        // Callback form of decodeAudioData for maximum Safari compatibility
        return new Promise((resolve, reject) => {
          ctx.decodeAudioData(arrBuf,
            decoded => { buffers[file] = decoded; resolve(); },
            err     => reject(err)
          );
        }).then(() => {
          loaded++;
          overlayStatus.textContent = `${loaded} / ${clips.length}`;
        });
      }));

      const failed = results.filter(r => r.status === 'rejected').length;
      if (failed > 0) {
        overlayStatus.textContent = `${failed} clip(s) failed to load`;
        overlayBtn.textContent    = 'Tap to retry';
        overlayBtn.disabled       = false;
        return;
      }

      // Step 3: re-resume context after all the awaits (iOS re-suspends across async gaps)
      await ctx.resume();
      overlay.style.display = 'none';
      btnPlayPause.disabled = false;
    });

    // ── Stop active source with gain fade ─────────────────────────────────────
    function stopActive(then) {
      if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
      if (!activeSource) { then && then(); return; }

      const src  = activeSource;
      activeSource = null;

      const now = ctx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, MIN_GAIN), now);
      masterGain.gain.exponentialRampToValueAtTime(MIN_GAIN, now + FADE_OUT);

      fadeTimer = setTimeout(() => {
        fadeTimer = null;
        try { src.stop(); } catch(e) {}
        src.disconnect();
        then && then();
      }, FADE_OUT * 1000 + 20);
    }

    // ── Start a BufferSource from an offset ───────────────────────────────────
    function startFrom(file, label, offset) {
      const buffer    = buffers[file];
      if (!buffer) return;
      const remaining = buffer.duration - offset;
      if (remaining <= 0) return;

      const now = ctx.currentTime;

      // Fade in
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(MIN_GAIN, now);
      masterGain.gain.exponentialRampToValueAtTime(1, now + FADE_IN);

      // Pre-schedule natural end fade
      const fadeOutAt = now + remaining - FADE_OUT;
      if (fadeOutAt > now + FADE_IN) {
        masterGain.gain.setValueAtTime(1, fadeOutAt);
        masterGain.gain.exponentialRampToValueAtTime(MIN_GAIN, now + remaining);
      }

      // Final safety net: ensure context is running before start()
      if (ctx.state !== 'running') ctx.resume();
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.connect(masterGain);
      src.start(now, offset);

      src.onended = () => {
        if (activeSource !== src) return;
        activeSource = null;
        activeMeta   = null;
        isPaused     = false;
        pauseOffset  = 0;
        stopProgressRaf();
        progressBar.style.width = '0%';
        nowPlaying.textContent  = '';
        btnStop.disabled        = true;
        showPlay();
        document.querySelectorAll('#clip-list li').forEach(el => el.classList.remove('active'));
      };

      activeSource = src;
      activeMeta   = { file, label, startedAt: now - offset, duration: buffer.duration };
      isPaused     = false;

      nowPlaying.textContent = `Playing: ${label}`;
      btnStop.disabled       = false;
      showPause();
      startProgress();
    }

    // ── Clip tap ──────────────────────────────────────────────────────────────
    function onClipTap(file, label, li) {
      if (!buffers[file]) return;

      // Re-warmup on every tap: iOS can re-suspend the context at any time.
      // Playing a fresh silent buffer synchronously inside the gesture guarantees
      // the context is running when startFrom() calls src.start().
      warmup();

      document.querySelectorAll('#clip-list li').forEach(el => el.classList.remove('active'));
      li.classList.add('active');

      stopActive(() => startFrom(file, label, 0));
    }

    // ── Play/Pause ────────────────────────────────────────────────────────────
    btnPlayPause.addEventListener('click', () => {
      warmup();

      if (activeSource && !isPaused) {
        // Pause: capture position before stopping
        const savedMeta = activeMeta;
        pauseOffset = Math.min(ctx.currentTime - activeMeta.startedAt, activeMeta.duration);
        isPaused    = true;
        stopProgressRaf();
        // Hold bar at pause position
        progressBar.style.width = (pauseOffset / savedMeta.duration * 100) + '%';
        stopActive(() => { activeMeta = savedMeta; isPaused = true; });
        showPlay();

      } else if (isPaused && activeMeta) {
        // Resume from saved offset
        const savedMeta   = activeMeta;
        const savedOffset = pauseOffset;
        stopActive(() => startFrom(savedMeta.file, savedMeta.label, savedOffset));
      }
    });

    // ── Stop ──────────────────────────────────────────────────────────────────
    btnStop.addEventListener('click', () => {
      warmup();
      stopActive();
      stopProgress();
      activeMeta  = null;
      isPaused    = false;
      pauseOffset = 0;
      nowPlaying.textContent = '';
      btnStop.disabled       = true;
      showPlay();
      document.querySelectorAll('#clip-list li').forEach(el => el.classList.remove('active'));
    });

    // ── Progress bar ──────────────────────────────────────────────────────────
    function startProgress() {
      stopProgressRaf();
      (function tick() {
        if (activeMeta && activeSource) {
          const pct = Math.min((ctx.currentTime - activeMeta.startedAt) / activeMeta.duration, 1) * 100;
          progressBar.style.width = pct + '%';
        }
        progressRaf = requestAnimationFrame(tick);
      })();
    }

    function stopProgressRaf() {
      if (progressRaf) { cancelAnimationFrame(progressRaf); progressRaf = null; }
    }

    function stopProgress() {
      stopProgressRaf();
      progressBar.style.width = '0%';
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    showPlay();
  </script>
</body>
</html>
