<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Audio Clips</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
      padding: 12px 14px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      text-align: center;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      border: 1px solid #111;
      border-radius: 0;
      padding: 0;
      cursor: pointer;
      background: #111;
      color: white;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 36px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active {
      background: white;
      color: #111;
    }
    .btn:disabled { opacity: 0.35; cursor: default; }

    .now-playing {
      flex: 1;
      font-size: 0.85rem;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* Progress bar — pure black on white, no grey */
    .progress-wrap {
      height: 4px;
      background: white;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #111;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px 24px;
    }

    .loading-indicator {
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      color: #aaa;
    }

    ul { list-style: none; }

    li {
      padding: 14px 12px;
      margin-bottom: 8px;
      background: white;
      border-radius: 0;
      border: 1px solid #eee;
      cursor: pointer;
      font-size: 1rem;
      text-align: center;
      user-select: none;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transform: none;
      -webkit-transform: none;
    }
    li:active { background: #f0f0f0; transform: none; }
    li:hover  { background: #f7f7f7; }
    li.active { border-color: #111; font-weight: 600; }
    li.loading::after { content: ' ⏳'; font-size: 0.8rem; }

    @media (min-width: 700px) {
      body {
        max-width: 600px;
        margin: 0 auto;
        border-left: 1px solid #eee;
        border-right: 1px solid #eee;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Audio Clips</h1>
    <div class="controls">
      <button class="btn" id="btn-play-pause" disabled aria-label="Play / Pause">
        <svg id="icon-play"  width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <svg id="icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="btn" id="btn-stop" disabled aria-label="Stop">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16"/></svg>
      </button>
      <span class="now-playing" id="now-playing"></span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <div class="list-container">
    <ul id="clip-list"></ul>
  </div>

  <!-- Hidden audio element — drives playback, invisible to user -->
  <audio id="player" preload="auto" style="display:none"></audio>

  <script>
    const clips = [
      { label: '1', file: 'audio/00 - audio - 1.mp3' },
      { label: '2', file: 'audio/00 - audio - 12.mp3' },
      { label: '3', file: 'audio/00 - audio - 13.mp3' },
      { label: '4', file: 'audio/00 - audio - 14.mp3' },
      { label: '5', file: 'audio/00 - audio - 15.mp3' },
      { label: '6', file: 'audio/00 - audio - 16.mp3' },
      { label: '7', file: 'audio/00 - audio - 17.mp3' },
      { label: '8', file: 'audio/00 - audio - 18.mp3' },
    ];

    const FADE_IN  = 0.06;  // seconds
    const FADE_OUT = 0.08;
    const MIN_GAIN = 0.0001;

    // ── Web Audio (just for gain/fades — audio element drives decoding) ───────
    const AudioCtx  = window.AudioContext || window.webkitAudioContext;
    const ctx       = new AudioCtx();
    const player    = document.getElementById('player');
    const mediaNode = ctx.createMediaElementSource(player);
    const gainNode  = ctx.createGain();
    mediaNode.connect(gainNode);
    gainNode.connect(ctx.destination);
    gainNode.gain.setValueAtTime(1, ctx.currentTime);

    // ── State ─────────────────────────────────────────────────────────────────
    let currentFile  = null;
    let fadeTimer    = null;
    let progressRaf  = null;

    // ── UI refs ───────────────────────────────────────────────────────────────
    const btnPlayPause = document.getElementById('btn-play-pause');
    const btnStop      = document.getElementById('btn-stop');
    const nowPlaying   = document.getElementById('now-playing');
    const progressBar  = document.getElementById('progress-bar');
    const clipList     = document.getElementById('clip-list');
    const iconPlay     = document.getElementById('icon-play');
    const iconPause    = document.getElementById('icon-pause');

    function showPlay()  { iconPlay.style.display = '';     iconPause.style.display = 'none'; }
    function showPause() { iconPlay.style.display = 'none'; iconPause.style.display = ''; }

    // ── Build list ────────────────────────────────────────────────────────────
    clips.forEach(({ label, file }) => {
      const li = document.createElement('li');
      li.textContent = label;
      li.dataset.file = file;
      li.addEventListener('click', () => onClipTap(file, label, li));
      clipList.appendChild(li);
    });

    // ── Fade helpers ──────────────────────────────────────────────────────────
    function fadeIn() {
      const now = ctx.currentTime;
      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(MIN_GAIN, now);
      gainNode.gain.exponentialRampToValueAtTime(1, now + FADE_IN);
    }

    function fadeOutThen(cb) {
      if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
      const now = ctx.currentTime;
      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(Math.max(gainNode.gain.value, MIN_GAIN), now);
      gainNode.gain.exponentialRampToValueAtTime(MIN_GAIN, now + FADE_OUT);
      fadeTimer = setTimeout(() => { fadeTimer = null; cb && cb(); }, FADE_OUT * 1000 + 30);
    }

    // ── Natural end-of-clip fade via timeupdate ───────────────────────────────
    player.addEventListener('timeupdate', () => {
      if (!player.duration) return;
      const remaining = player.duration - player.currentTime;
      if (remaining > 0 && remaining <= FADE_OUT + 0.15) {
        const now = ctx.currentTime;
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(Math.max(gainNode.gain.value, MIN_GAIN), now);
        gainNode.gain.exponentialRampToValueAtTime(MIN_GAIN, now + remaining);
      }
    });

    player.addEventListener('ended', () => {
      gainNode.gain.cancelScheduledValues(ctx.currentTime);
      gainNode.gain.setValueAtTime(MIN_GAIN, ctx.currentTime);
      stopProgress();
      currentFile = null;
      nowPlaying.textContent = '';
      btnStop.disabled = true;
      showPlay();
      document.querySelectorAll('#clip-list li').forEach(el => el.classList.remove('active'));
    });

    // ── Clip tap ──────────────────────────────────────────────────────────────
    function onClipTap(file, label, li) {
      ctx.resume();

      document.querySelectorAll('#clip-list li').forEach(el => el.classList.remove('active'));
      li.classList.add('active');
      nowPlaying.textContent = `Playing: ${label}`;
      btnStop.disabled = false;
      btnPlayPause.disabled = false;

      if (!player.paused && currentFile === file) {
        // Tapped same clip — restart it
        fadeOutThen(() => {
          player.currentTime = 0;
          fadeIn();
          player.play().catch(() => {});
        });
        return;
      }

      if (!player.paused) {
        // Different clip — fade out then switch
        fadeOutThen(() => {
          currentFile = file;
          player.src = file;
          player.load();
          fadeIn();
          player.play().catch(() => {});
          startProgress();
          showPause();
        });
      } else {
        // Nothing playing — just start
        currentFile = file;
        player.src = file;
        player.load();
        fadeIn();
        player.play().catch(() => {});
        startProgress();
        showPause();
      }
    }

    // ── Play/Pause ────────────────────────────────────────────────────────────
    btnPlayPause.addEventListener('click', () => {
      ctx.resume();
      if (!player.paused) {
        fadeOutThen(() => player.pause());
        stopProgressRaf();
        // Hold bar at current position
        if (player.duration) {
          progressBar.style.width = (player.currentTime / player.duration * 100) + '%';
        }
        showPlay();
      } else if (player.src) {
        fadeIn();
        player.play().catch(() => {});
        startProgress();
        showPause();
      }
    });

    // ── Stop ──────────────────────────────────────────────────────────────────
    btnStop.addEventListener('click', () => {
      ctx.resume();
      fadeOutThen(() => {
        player.pause();
        player.currentTime = 0;
      });
      stopProgress();
      currentFile = null;
      nowPlaying.textContent = '';
      btnStop.disabled = true;
      showPlay();
      document.querySelectorAll('#clip-list li').forEach(el => el.classList.remove('active'));
    });

    // ── Progress bar ──────────────────────────────────────────────────────────
    function startProgress() {
      stopProgressRaf();
      (function tick() {
        if (player.duration) {
          progressBar.style.width = (player.currentTime / player.duration * 100) + '%';
        }
        progressRaf = requestAnimationFrame(tick);
      })();
    }

    function stopProgressRaf() {
      if (progressRaf) { cancelAnimationFrame(progressRaf); progressRaf = null; }
    }

    function stopProgress() {
      stopProgressRaf();
      progressBar.style.width = '0%';
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    btnPlayPause.disabled = false;
    showPlay();
  </script>
</body>
</html>
