<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Audio Clips</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
      padding: 12px 14px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      text-align: center;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      border: 1px solid #111;
      border-radius: 0;
      padding: 0;
      cursor: pointer;
      background: #111;
      color: white;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 36px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active {
      background: white;
      color: #111;
    }
    .btn:disabled { opacity: 0.35; cursor: default; }

    .now-playing {
      flex: 1;
      font-size: 0.85rem;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* Progress bar — pure black on white, no grey */
    .progress-wrap {
      height: 4px;
      background: white;
      border-top: 1px solid #eee;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #111;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px 24px;
    }

    .loading-indicator {
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      color: #aaa;
    }

    ul { list-style: none; }

    li {
      padding: 14px 12px;
      margin-bottom: 8px;
      background: white;
      border-radius: 0;
      border: 1px solid #eee;
      cursor: pointer;
      font-size: 1rem;
      text-align: center;
      user-select: none;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transform: none;
      -webkit-transform: none;
    }
    li:active { background: #f0f0f0; transform: none; }
    li:hover  { background: #f7f7f7; }
    li.active { border-color: #111; font-weight: 600; }
    li.loading::after { content: ' ⏳'; font-size: 0.8rem; }

    @media (min-width: 700px) {
      body {
        max-width: 600px;
        margin: 0 auto;
        border-left: 1px solid #eee;
        border-right: 1px solid #eee;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Audio Clips</h1>
    <div class="controls">
      <button class="btn" id="btn-play-pause" disabled aria-label="Play / Pause">
        <svg id="icon-play"  width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        <svg id="icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="btn" id="btn-stop" disabled aria-label="Stop">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16"/></svg>
      </button>
      <span class="now-playing" id="now-playing"></span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <div class="list-container">
    <div class="loading-indicator" id="loading-msg"></div>
    <ul id="clip-list"></ul>
  </div>

  <script>
    // ── Config ────────────────────────────────────────────────────────────────
    const clips = [
      { label: '1', file: 'audio/00 - audio - 1.mp3' },
      { label: '2', file: 'audio/00 - audio - 2.mp3' },
      { label: '3', file: 'audio/00 - audio - 3.mp3' },
      { label: '4', file: 'audio/00 - audio - 4.mp3' },
      { label: '5', file: 'audio/00 - audio - 5.mp3' },
      { label: '6', file: 'audio/00 - audio - 6.mp3' },
      { label: '7', file: 'audio/00 - audio - 7.mp3' },
      { label: '8', file: 'audio/00 - audio - 8.mp3' },
    ];

    const FADE_IN  = 0.06;
    const FADE_OUT = 0.08;
    const MIN_GAIN = 0.0001;

    // ── AudioContext ──────────────────────────────────────────────────────────
    // Create immediately so it exists — it will be "suspended" on iOS until
    // we play a real buffer inside a user gesture (the warmup below).
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    let ctxWarmedUp = false;

    // iOS requires actually playing a (silent) buffer synchronously inside
    // a touchstart/click handler to truly unlock audio output. resume() alone
    // is not sufficient on Chrome/Firefox for iOS.
    function warmUpCtx() {
      if (ctxWarmedUp) return;
      ctx.resume();
      const silent = ctx.createBuffer(1, 1, ctx.sampleRate);
      const warmup = ctx.createBufferSource();
      warmup.buffer = silent;
      warmup.connect(ctx.destination);
      warmup.start(0);
      ctxWarmedUp = true;
    }

    // Handle iOS "interrupted" state — occurs when a call comes in, screen
    // locks, or user switches apps. Poll until the OS clears the interruption.
    ctx.addEventListener('statechange', () => {
      if (ctx.state === 'interrupted') {
        const poll = setInterval(() => {
          if (ctx.state !== 'interrupted') {
            clearInterval(poll);
            ctx.resume();
          }
        }, 500);
      }
    });

    // ── State ─────────────────────────────────────────────────────────────────
    let activeSource = null;
    let activeGain   = null;
    let activeMeta   = null;
    let isPaused     = false;
    let pauseOffset  = 0;
    let stopTimer    = null;
    let progressRaf  = null;
    const buffers    = {};

    // ── UI refs ───────────────────────────────────────────────────────────────
    const btnPlayPause = document.getElementById('btn-play-pause');
    const btnStop      = document.getElementById('btn-stop');
    const nowPlaying   = document.getElementById('now-playing');
    const progressBar  = document.getElementById('progress-bar');
    const loadingMsg   = document.getElementById('loading-msg');
    const clipList     = document.getElementById('clip-list');
    const iconPlay     = document.getElementById('icon-play');
    const iconPause    = document.getElementById('icon-pause');

    function showPlay()  { iconPlay.style.display = '';     iconPause.style.display = 'none'; }
    function showPause() { iconPlay.style.display = 'none'; iconPause.style.display = ''; }

    // ── Build clip list ───────────────────────────────────────────────────────
    clips.forEach(({ label, file }) => {
      const li = document.createElement('li');
      li.textContent = label;
      li.dataset.file = file;
      // touchstart fires synchronously before click — perfect for iOS warmup
      li.addEventListener('touchstart', () => warmUpCtx(), { passive: true });
      li.addEventListener('click', () => onClipTap(file, label, li));
      clipList.appendChild(li);
    });

    btnPlayPause.addEventListener('touchstart', () => warmUpCtx(), { passive: true });
    btnStop.addEventListener('touchstart',      () => warmUpCtx(), { passive: true });

    // ── Fetch + decode (callback form for max Safari compat) ──────────────────
    async function getBuffer(file) {
      if (buffers[file]) return buffers[file];
      const res    = await fetch(file);
      const arrBuf = await res.arrayBuffer();
      return new Promise((resolve, reject) => {
        ctx.decodeAudioData(
          arrBuf,
          decoded => { buffers[file] = decoded; resolve(decoded); },
          err     => reject(err)
        );
      });
    }

    // ── Background preload after context is unlocked ──────────────────────────
    let preloadStarted = false;
    function backgroundPreload(skipFile) {
      if (preloadStarted) return;
      preloadStarted = true;
      let done = 0;
      clips.forEach(({ file }) => {
        if (file === skipFile) { done++; return; }
        getBuffer(file)
          .then(() => {
            done++;
            loadingMsg.textContent = done < clips.length
              ? `Preloading… ${done}/${clips.length}`
              : '';
          })
          .catch(e => console.warn('Preload failed:', file, e));
      });
    }

    // ── Stop current playback with fade ───────────────────────────────────────
    function stopCurrent(then) {
      if (stopTimer) { clearTimeout(stopTimer); stopTimer = null; }
      if (!activeSource) { then && then(); return; }

      const gain = activeGain;
      const src  = activeSource;
      activeSource = null;
      activeGain   = null;

      const now = ctx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(Math.max(gain.gain.value, MIN_GAIN), now);
      gain.gain.exponentialRampToValueAtTime(MIN_GAIN, now + FADE_OUT);

      stopTimer = setTimeout(() => {
        try { src.stop(); } catch(e) {}
        src.disconnect();
        gain.disconnect();
        then && then();
      }, FADE_OUT * 1000 + 40);
    }

    // ── Start playback from an offset ─────────────────────────────────────────
    function startFrom(file, label, buffer, offset) {
      if (ctx.state === 'interrupted') {
        // Retry once interruption clears
        ctx.resume().then(() => startFrom(file, label, buffer, offset));
        return;
      }

      const remaining = buffer.duration - offset;
      if (remaining <= 0) return;
      const now = ctx.currentTime;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(MIN_GAIN, now);
      gain.gain.exponentialRampToValueAtTime(1, now + FADE_IN);

      const fadeOutAt = now + remaining - FADE_OUT;
      if (fadeOutAt > now + FADE_IN) {
        gain.gain.setValueAtTime(1, fadeOutAt);
        gain.gain.exponentialRampToValueAtTime(MIN_GAIN, now + remaining);
      }
      gain.connect(ctx.destination);

      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.connect(gain);
      src.start(now, offset);

      src.onended = () => {
        if (activeSource !== src) return;
        activeSource = null;
        activeGain   = null;
        activeMeta   = null;
        isPaused     = false;
        pauseOffset  = 0;
        stopProgressRaf();
        progressBar.style.width = '0%';
        nowPlaying.textContent  = '';
        btnStop.disabled        = true;
        showPlay();
        document.querySelectorAll('#clip-list li').forEach(el => el.classList.remove('active'));
      };

      activeSource = src;
      activeGain   = gain;
      activeMeta   = { file, label, startedAt: now - offset, duration: buffer.duration };
      isPaused     = false;

      nowPlaying.textContent = `Playing: ${label}`;
      btnStop.disabled       = false;
      btnPlayPause.disabled  = false;
      showPause();
      startProgress();
    }

    // ── Clip tap ──────────────────────────────────────────────────────────────
    async function onClipTap(file, label, li) {
      warmUpCtx();
      if (ctx.state !== 'running') await ctx.resume();

      document.querySelectorAll('#clip-list li').forEach(el => el.classList.remove('active', 'loading'));
      li.classList.add('loading');

      let buffer;
      try {
        buffer = await getBuffer(file);
      } catch(e) {
        console.error('Failed to load:', file, e);
        li.classList.remove('loading');
        nowPlaying.textContent = 'Error loading clip';
        return;
      }

      if (ctx.state !== 'running') await ctx.resume();

      li.classList.remove('loading');
      li.classList.add('active');

      stopCurrent(() => {
        startFrom(file, label, buffer, 0);
        backgroundPreload(file);
      });
    }

    // ── Play/Pause button ─────────────────────────────────────────────────────
    btnPlayPause.addEventListener('click', async () => {
      warmUpCtx();
      if (ctx.state !== 'running') await ctx.resume();

      if (activeSource && !isPaused) {
        // Pause — freeze bar at current position
        const savedMeta = activeMeta;
        pauseOffset     = Math.min(ctx.currentTime - activeMeta.startedAt, activeMeta.duration);
        isPaused        = true;
        stopProgressRaf();
        const pct = (pauseOffset / savedMeta.duration) * 100;
        progressBar.style.width = pct + '%';
        stopCurrent(() => { activeMeta = savedMeta; isPaused = true; });
        showPlay();

      } else if (isPaused && activeMeta) {
        // Resume from saved offset
        const savedMeta   = activeMeta;
        const savedOffset = pauseOffset;
        if (ctx.state !== 'running') await ctx.resume();
        getBuffer(savedMeta.file).then(buffer => {
          if (!isPaused) return;
          startFrom(savedMeta.file, savedMeta.label, buffer, savedOffset);
        });
      }
    });

    // ── Stop button ───────────────────────────────────────────────────────────
    btnStop.addEventListener('click', () => {
      warmUpCtx();
      stopCurrent();
      stopProgressRaf();
      activeMeta              = null;
      isPaused                = false;
      pauseOffset             = 0;
      progressBar.style.width = '0%';
      nowPlaying.textContent  = '';
      btnStop.disabled        = true;
      showPlay();
      document.querySelectorAll('#clip-list li').forEach(el => el.classList.remove('active'));
    });

    // ── Progress tracking ─────────────────────────────────────────────────────
    function startProgress() {
      stopProgressRaf();
      (function tick() {
        if (!activeMeta || !activeSource) return;
        const pct = Math.min((ctx.currentTime - activeMeta.startedAt) / activeMeta.duration, 1) * 100;
        progressBar.style.width = pct + '%';
        progressRaf = requestAnimationFrame(tick);
      })();
    }

    function stopProgressRaf() {
      if (progressRaf) { cancelAnimationFrame(progressRaf); progressRaf = null; }
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    btnPlayPause.disabled = false;
    showPlay();
  </script>
</body>
</html>
