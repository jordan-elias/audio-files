<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Audio Clips</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #000000;
      color: #111;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
      padding: 12px 14px 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 1.1rem;
      margin: 0 0 8px 0;
      text-align: center;
    }
    audio {
      width: 100%;
    }
    .list-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px 24px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      padding: 14px 12px;
      margin-bottom: 8px;
      background: white;
      border-radius: 8px;
      border: 1px solid #eee;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
      font-size: 1rem;
      text-align: center;
      user-select: none;
    }
    li:active {
      transform: scale(0.98);
      background: #f0f0f0;
    }
    li:hover {
      background: #f7f7f7;
    }
    @media (min-width: 700px) {
      body {
        max-width: 600px;
        margin: 0 auto;
        border-left: 1px solid #eee;
        border-right: 1px solid #eee;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Audio Clips</h1>
    <audio id="player" controls>
      Your browser does not support the audio element.
    </audio>
  </div>
  <div class="list-container">
    <ul id="clip-list"></ul>
  </div>

  <script>
    const player = document.getElementById('player');
    const list = document.getElementById('clip-list');

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const source = ctx.createMediaElementSource(player);
    const gainNode = ctx.createGain();
    source.connect(gainNode);
    gainNode.connect(ctx.destination);
    gainNode.gain.setValueAtTime(1, ctx.currentTime);

    const FADE_IN  = 0.08;
    const FADE_OUT = 0.1;
    const MIN_GAIN = 0.0001;

    let fadeOutTimer = null;
    let pendingSrc = null;

    const clips = [
      { label: '1', file: 'audio/1.wav' },
      { label: '2', file: 'audio/2.wav' },
      { label: '3', file: 'audio/3.wav' },
      { label: '4', file: 'audio/4.wav' },
      { label: '5', file: 'audio/5.wav' },
      { label: '6', file: 'audio/6.wav' },
      { label: '7', file: 'audio/7.wav' },
      { label: '8', file: 'audio/8.wav' },
    ];

    const objectURLs = {};

    async function preloadAll() {
      await Promise.all(clips.map(async ({ file }) => {
        try {
          const res = await fetch(file);
          const blob = await res.blob();
          objectURLs[file] = URL.createObjectURL(blob);
        } catch (e) {
          console.warn('Failed to preload:', file, e);
        }
      }));
    }

    clips.forEach(({ label, file }) => {
      const li = document.createElement('li');
      li.textContent = label;
      li.addEventListener('click', () => playClip(file));
      list.appendChild(li);
    });

    function cancelPending() {
      if (fadeOutTimer) { clearTimeout(fadeOutTimer); fadeOutTimer = null; }
      pendingSrc = null;
    }

    function fadeIn() {
      const now = ctx.currentTime;
      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(MIN_GAIN, now);
      gainNode.gain.exponentialRampToValueAtTime(1, now + FADE_IN);
    }

    function fadeOutThen(callback) {
      const now = ctx.currentTime;
      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(Math.max(gainNode.gain.value, MIN_GAIN), now);
      gainNode.gain.exponentialRampToValueAtTime(MIN_GAIN, now + FADE_OUT);
      fadeOutTimer = setTimeout(callback, (FADE_OUT * 1000) + 50);
    }

    player.addEventListener('timeupdate', () => {
      if (!player.duration) return;
      const remaining = player.duration - player.currentTime;
      if (remaining > 0 && remaining <= FADE_OUT + 0.15) {
        const now = ctx.currentTime;
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(Math.max(gainNode.gain.value, MIN_GAIN), now);
        gainNode.gain.exponentialRampToValueAtTime(MIN_GAIN, now + remaining);
      }
    });

    player.addEventListener('ended', () => {
      gainNode.gain.cancelScheduledValues(ctx.currentTime);
      gainNode.gain.setValueAtTime(MIN_GAIN, ctx.currentTime);
    });

    function playClip(file) {
      cancelPending();
      ctx.resume();

      const src = objectURLs[file] || file;

      if (player.paused || player.ended) {
        player.src = src;
        player.load();
        fadeIn();
        player.play().catch(() => {});
      } else {
        pendingSrc = src;
        fadeOutThen(() => {
          if (!pendingSrc) return;
          const nextSrc = pendingSrc;
          pendingSrc = null;
          player.src = nextSrc;
          player.load();
          fadeIn();
          player.play().catch(() => {});
        });
      }
    }

    preloadAll();
  </script>
</body>
</html>
