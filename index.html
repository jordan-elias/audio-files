<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Audio Clips</title>

  <!-- Mobile viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #000000;
      color: #111;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Sticky header */
    .header {
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
      padding: 12px 14px 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 1.1rem;
      margin: 0 0 8px 0;
      text-align: center;
    }

    audio {
      width: 100%;
    }

    /* Scroll container */
    .list-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 14px 24px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      padding: 14px 12px;
      margin-bottom: 8px;
      background: white;
      border-radius: 8px;
      border: 1px solid #eee;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
      font-size: 1rem;
      text-align: center;
      user-select: none;
    }

    li:active {
      transform: scale(0.98);
      background: #f0f0f0;
    }

    li:hover {
      background: #f7f7f7;
    }

    /* Desktop enhancement */
    @media (min-width: 700px) {
      body {
        max-width: 600px;
        margin: 0 auto;
        border-left: 1px solid #eee;
        border-right: 1px solid #eee;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Audio Clips</h1>
    <audio id="player" controls>
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="list-container">
    <ul>
      <li onclick="playClip('audio/1.wav')">1</li>
      <li onclick="playClip('audio/2.wav')">2</li>
      <li onclick="playClip('audio/3.wav')">3</li>
      <li onclick="playClip('audio/4.wav')">4</li>
      <li onclick="playClip('audio/5.wav')">5</li>
      <li onclick="playClip('audio/6.wav')">6</li>
      <li onclick="playClip('audio/7.wav')">7</li>
      <li onclick="playClip('audio/8.wav')">8</li>
    </ul>
  </div>

  
<script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioCtx();

  const FADE_IN  = 0.04;
  const FADE_OUT = 0.06;

  const cache = {};          // decoded AudioBuffer cache
  let activeSource = null;   // currently playing BufferSourceNode
  let activeGain   = null;   // its gain node
  let isStopping   = false;  // guard against double-stops

  // Keep a reference to the visible <audio> element just for the UI controls
  // We hijack its play/pause button via AudioContext instead of letting it drive playback
  const playerUI = document.getElementById('player');
  playerUI.style.display = 'none'; // hide it — we drive playback ourselves

  // Show a minimal play/pause + time display instead, or leave hidden entirely.
  // (Remove the line above if you still want the native controls visible — 
  //  but note they won't control WebAudio buffer playback.)

  async function fetchAndDecode(src) {
    if (cache[src]) return cache[src];
    const response = await fetch(src);
    const arrayBuffer = await response.arrayBuffer();
    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
    cache[src] = audioBuffer;
    return audioBuffer;
  }

  function stopCurrent(onStopped) {
    if (!activeSource || isStopping) {
      onStopped && onStopped();
      return;
    }
    isStopping = true;
    const gain = activeGain;
    const src  = activeSource;
    const now  = ctx.currentTime;

    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.linearRampToValueAtTime(0, now + FADE_OUT);

    // Disconnect after fade — use setTimeout as a fallback since
    // onended may not fire reliably mid-playback on iOS
    setTimeout(() => {
      try { src.stop(); } catch(e) {}
      src.disconnect();
      gain.disconnect();
      isStopping = false;
      onStopped && onStopped();
    }, FADE_OUT * 1000 + 20); // small extra buffer for iOS scheduling lag
  }

  async function playClip(src) {
    // iOS requires AudioContext resume from a user gesture
    if (ctx.state === 'suspended') await ctx.resume();

    // Pre-fetch in parallel while fade-out runs
    const bufferPromise = fetchAndDecode(src);

    stopCurrent(async () => {
      const buffer = await bufferPromise;
      const now = ctx.currentTime;

      // Create a new source + gain for each clip (required for BufferSourceNode)
      const gainNode = ctx.createGain();
      gainNode.gain.setValueAtTime(0, now);
      gainNode.gain.linearRampToValueAtTime(1, now + FADE_IN);
      gainNode.connect(ctx.destination);

      const sourceNode = ctx.createBufferSource();
      sourceNode.buffer = buffer;
      sourceNode.connect(gainNode);

      // Fade out end-of-clip naturally
      const clipEnd = now + buffer.duration;
      gainNode.gain.setValueAtTime(1, clipEnd - FADE_OUT);
      gainNode.gain.linearRampToValueAtTime(0, clipEnd);

      sourceNode.start(now);
      sourceNode.onended = () => {
        sourceNode.disconnect();
        gainNode.disconnect();
        if (activeSource === sourceNode) {
          activeSource = null;
          activeGain   = null;
        }
      };

      activeSource = sourceNode;
      activeGain   = gainNode;
    });
  }
</script>


</body>
</html>
