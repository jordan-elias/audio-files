<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Oscillator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #000;
  color: #111;
}

body {
  display: flex;
  flex-direction: column;
}

.header {
  background: white;
  padding: 12px 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

h1 {
  font-size: 1.1rem;
  text-align: center;
  margin-bottom: 10px;
}

.controls {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.btn {
  width: 48px;
  height: 40px;
  border: 1px solid #111;
  background: #111;
  color: white;
  cursor: pointer;
  font-size: 16px;
  touch-action: manipulation;
}

.btn:active {
  background: white;
  color: #111;
}

.btn.on {
  background: white;
  color: #111;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 14px 14px;
}

.section {
  background: white;
  border: 1px solid #eee;
}

.section-header {
  padding: 12px;
  text-align: center;
  cursor: pointer;
  user-select: none;
}

.section-content {
  display: none;
  padding: 12px;
}

.section.open .section-content {
  display: block;
}

.param-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}

.param-label {
  width: 70px;
  font-size: 0.85rem;
}

.param-slider {
  flex: 1;
}

.number-input {
  width: 70px;
  height: 34px;
  border: 1px solid #111;
  text-align: center;
}

select {
  height: 34px;
  border: 1px solid #111;
  width: 100%;
}

.toggle {
  width: 70px;
  height: 34px;
  border: 1px solid #111;
  background: #111;
  color: white;
}

.toggle.off {
  background: white;
  color: #111;
}

#overlay {
  position: fixed;
  inset: 0;
  background: #111;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}

#overlay button {
  padding: 14px 28px;
  border: none;
  background: white;
  cursor: pointer;
}

@media (min-width: 700px) {
  body {
    max-width: 600px;
    margin: 0 auto;
    border-left: 1px solid #eee;
    border-right: 1px solid #eee;
  }
}

</style>
</head>

<body>

<div id="overlay">
<h2 style="color:white;">Oscillator</h2>
<button id="overlay-btn">Tap to start</button>
</div>

<div class="header">

<h1>Oscillator</h1>

<div class="controls">

<button id="btn-play" class="btn">
▶
</button>

<button id="btn-stop" class="btn">
■
</button>

</div>

</div>

<div class="main">

<div class="section">

<div class="section-header">
Frequency
</div>

<div class="section-content" style="display:block;">

<div class="param-row">

<button id="freq-minus" class="btn">−</button>

<input
id="freq-slider"
type="range"
class="param-slider"
min="20"
max="2000"
step="1"
value="440"
/>

<button id="freq-plus" class="btn">+</button>

<input
id="freq-input"
class="number-input"
type="number"
min="20"
max="2000"
step="1"
value="440"
/>

</div>

</div>

</div>

<div class="section">

<div class="section-header">
Waveform
</div>

<div class="section-content">

<select id="waveform">

<option value="sine">
Sine
</option>

<option value="square">
Square
</option>

<option value="triangle">
Triangle
</option>

<option value="sawtooth">
Sawtooth
</option>

</select>

</div>

</div>

<div class="section">

<div class="section-header">
EQ
</div>

<div class="section-content">

<div class="param-row">

<div class="param-label">
Low
</div>

<input id="eq-low" type="range" min="-12" max="12" step="0.1" class="param-slider" value="0">

<input id="eq-low-input" type="number" min="-12" max="12" step="0.1" class="number-input" value="0">

</div>

<div class="param-row">

<div class="param-label">
Mid
</div>

<input id="eq-mid" type="range" min="-12" max="12" step="0.1" class="param-slider" value="0">

<input id="eq-mid-input" type="number" min="-12" max="12" step="0.1" class="number-input" value="0">

</div>

<div class="param-row">

<div class="param-label">
High
</div>

<input id="eq-high" type="range" min="-12" max="12" step="0.1" class="param-slider" value="0">

<input id="eq-high-input" type="number" min="-12" max="12" step="0.1" class="number-input" value="0">

</div>

</div>

</div>

<div class="section">

<div class="section-header">
LFO
</div>

<div class="section-content">

<div class="param-row">

<div class="param-label">
Enable
</div>

<button id="lfo-toggle" class="toggle off">
OFF
</button>

</div>

<div class="param-row">

<div class="param-label">
Rate
</div>

<input id="lfo-rate" type="range" min="0.1" max="20" step="0.1" class="param-slider" value="5">

<input id="lfo-rate-input" type="number" min="0.1" max="20" step="0.1" class="number-input" value="5">

</div>

<div class="param-row">

<div class="param-label">
Depth
</div>

<input id="lfo-depth" type="range" min="0" max="200" step="1" class="param-slider" value="50">

<input id="lfo-depth-input" type="number" min="0" max="200" step="1" class="number-input" value="50">

</div>

</div>

</div>

<div class="section">

<div class="section-header">
Effects
</div>

<div class="section-content">

<div class="param-row">

<div class="param-label">
Reverb
</div>

<input id="reverb-mix" type="range" min="0" max="1" step="0.01" class="param-slider" value="0">

<input id="reverb-input" type="number" min="0" max="1" step="0.01" class="number-input" value="0">

</div>

<div class="param-row">

<div class="param-label">
Delay
</div>

<input id="delay-time" type="range" min="0" max="1" step="0.01" class="param-slider" value="0">

<input id="delay-input" type="number" min="0" max="1" step="0.01" class="number-input" value="0">

</div>

</div>

</div>

</div>

<script>

const AudioCtx =
window.AudioContext ||
window.webkitAudioContext

const ctx = new AudioCtx()

let osc
let masterGain

let lowFilter
let midFilter
let highFilter

let lfo
let lfoGain

let delayNode
let delayGain

let convolver
let reverbGain

let playing = false
let lfoEnabled = false

function warmup(){

ctx.resume()

const silent =
ctx.createBuffer(1,1,ctx.sampleRate)

const src =
ctx.createBufferSource()

src.buffer = silent
src.connect(ctx.destination)
src.start()

}

document.getElementById("overlay-btn")
.addEventListener("click",()=>{

warmup()

document.getElementById("overlay")
.style.display="none"

})

function impulseResponse(){

const length =
ctx.sampleRate * 2

const buffer =
ctx.createBuffer(
2,
length,
ctx.sampleRate
)

for(let c=0;c<2;c++){

const data =
buffer.getChannelData(c)

for(let i=0;i<length;i++){

data[i] =
(Math.random()*2-1)
*
Math.pow(
1-i/length,
2
)

}

}

return buffer

}

function createGraph(){

osc =
ctx.createOscillator()

osc.type =
waveform.value

masterGain =
ctx.createGain()

masterGain.gain.value =
0.5

lowFilter =
ctx.createBiquadFilter()

lowFilter.type =
"lowshelf"

lowFilter.frequency.value =
200

midFilter =
ctx.createBiquadFilter()

midFilter.type =
"peaking"

midFilter.frequency.value =
1000

midFilter.Q.value =
1

highFilter =
ctx.createBiquadFilter()

highFilter.type =
"highshelf"

highFilter.frequency.value =
3000

delayNode =
ctx.createDelay()

delayGain =
ctx.createGain()

delayGain.gain.value =
0

convolver =
ctx.createConvolver()

convolver.buffer =
impulseResponse()

reverbGain =
ctx.createGain()

reverbGain.gain.value =
0

osc
.connect(lowFilter)

lowFilter
.connect(midFilter)

midFilter
.connect(highFilter)

highFilter
.connect(masterGain)

masterGain
.connect(ctx.destination)

masterGain
.connect(delayNode)

delayNode
.connect(delayGain)

delayGain
.connect(masterGain)

masterGain
.connect(convolver)

convolver
.connect(reverbGain)

reverbGain
.connect(masterGain)

lfo =
ctx.createOscillator()

lfo.type =
"sine"

lfoGain =
ctx.createGain()

lfo.connect(lfoGain)

}

function startOsc(){

if(playing)
return

warmup()

createGraph()

osc.frequency.value =
Number(freqInput.value)

if(lfoEnabled){

lfoGain.connect(
osc.frequency
)

lfo.start()

}

osc.start()

btnPlay.classList.add("on")

playing = true

}

function stopOsc(){

if(!playing)
return

const now =
ctx.currentTime

masterGain.gain
.setTargetAtTime(
0,
now,
0.02
)

setTimeout(()=>{

try{
osc.stop()
}catch{}

if(lfoEnabled){

try{
lfo.stop()
}catch{}

}

btnPlay.classList.remove("on")

playing = false

},60)

}

const btnPlay =
document.getElementById("btn-play")

const btnStop =
document.getElementById("btn-stop")

btnPlay.addEventListener(
"click",
startOsc
)

btnStop.addEventListener(
"click",
()=>{

btnStop.classList.add("on")

setTimeout(()=>{
btnStop.classList.remove("on")
},120)

stopOsc()

}
)

function setFrequency(v){

v =
Math.min(
2000,
Math.max(
20,
Number(v)
)
)

freqSlider.value = v
freqInput.value = v

if(osc){

osc.frequency
.setTargetAtTime(
v,
ctx.currentTime,
0.01
)

}

}

const freqSlider =
document.getElementById("freq-slider")

const freqInput =
document.getElementById("freq-input")

freqSlider.addEventListener(
"input",
e=>setFrequency(
e.target.value
)
)

freqInput.addEventListener(
"change",
e=>setFrequency(
e.target.value
)
)

document.getElementById("freq-minus")
.onclick=()=>setFrequency(
Number(freqInput.value)-1
)

document.getElementById("freq-plus")
.onclick=()=>setFrequency(
Number(freqInput.value)+1
)

waveform.addEventListener(
"change",
()=>{

if(osc){

osc.type =
waveform.value

}

}
)

function bindEQ(slider,input,node){

function set(v){

v =
Math.min(
12,
Math.max(
-12,
Number(v)
)
)

slider.value=v
input.value=v

if(node){

node.gain
.setTargetAtTime(
v,
ctx.currentTime,
0.01
)

}

}

slider.addEventListener(
"input",
e=>set(e.target.value)
)

input.addEventListener(
"change",
e=>set(e.target.value)
)

}

bindEQ(
eqLow,
eqLowInput,
lowFilter
)

bindEQ(
eqMid,
eqMidInput,
midFilter
)

bindEQ(
eqHigh,
eqHighInput,
highFilter
)

document.getElementById("lfo-toggle")
.addEventListener(
"click",
e=>{

lfoEnabled =
!lfoEnabled

e.target.textContent =
lfoEnabled
? "ON"
: "OFF"

e.target.classList
.toggle(
"off",
!lfoEnabled
)

}
)

document
.querySelectorAll(
".section-header"
)
.forEach(h=>{

h.addEventListener(
"click",
()=>{

h.parentElement
.classList
.toggle("open")

}
)

})

</script>

  <footer class="site-footer">
  <a href="https://jordanelias.de" target="_blank" rel="noopener">
    jordanelias.de
  </a>
</footer>

</body>
</html>
