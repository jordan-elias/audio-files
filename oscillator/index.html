<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Oscillator</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f7;
}

.app-container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px 10px 34px 10px; /* bottom padding for footer */
    box-sizing: border-box;
}

h1 {
    text-align: center;
    font-size: 20px;
    margin: 6px 0 10px 0;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
}

button {
    padding: 12px 16px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.play-btn {
    background: #2ecc71;
    color: white;
}

.play-btn.active {
    background: white;
    color: #2ecc71;
    border: 2px solid #2ecc71;
}

.stop-btn {
    background: #e74c3c;
    color: white;
}

.stop-btn.active {
    background: white;
    color: #e74c3c;
    border: 2px solid #e74c3c;
}

.section {
    background: white;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
}

.label {
    text-align: center;
    font-size: 14px;
    margin-bottom: 6px;
}

.value-control {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

.value-control input[type="number"] {
    width: 90px;
    padding: 6px;
    font-size: 16px;
    text-align: center;
}

.value-control button {
    width: 36px;
    height: 36px;
    font-size: 18px;
}

.slider {
    width: 100%;
    margin-top: 6px;
}

.collapsible {
    background: white;
    border-radius: 12px;
    margin-bottom: 8px;
}

.collapsible-header {
    padding: 12px;
    text-align: center;
    font-size: 15px;
    cursor: pointer;
    user-select: none;
}

.collapsible-content {
    display: none;
    padding: 10px;
    border-top: 1px solid #eee;
}

.collapsible.open .collapsible-content {
    display: block;
}

select {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
}

.site-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 11px;
    padding: 6px 0;
    background: #ffffff;
    border-top: 1px solid #eee;
}

.site-footer a {
    color: #666;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="app-container">

<h1>Oscillator</h1>

<div class="controls">
    <button id="playBtn" class="play-btn">PLAY</button>
    <button id="stopBtn" class="stop-btn">STOP</button>
</div>

<div class="section">
    <div class="label">Frequency (Hz)</div>

    <div class="value-control">
        <button id="freqMinus">−</button>
        <input type="number" id="freqInput" value="440" min="20" max="20000" step="1">
        <button id="freqPlus">+</button>
    </div>

    <input
        type="range"
        id="freqSlider"
        class="slider"
        min="20"
        max="20000"
        value="440"
    >
</div>

<div class="collapsible" id="waveformSection">

<div class="collapsible-header">Waveform ▸</div>

<div class="collapsible-content">

<select id="waveformSelect">
    <option value="sine">Sine</option>
    <option value="square">Square</option>
    <option value="triangle">Triangle</option>
    <option value="sawtooth">Sawtooth</option>
</select>

</div>

</div>

<div class="collapsible" id="gainSection">

<div class="collapsible-header">Volume ▸</div>

<div class="collapsible-content">

<input
    type="range"
    id="gainSlider"
    class="slider"
    min="0"
    max="1"
    step="0.01"
    value="0.2"
>

</div>

</div>

</div>

<footer class="site-footer">
    <a href="/oscillator/index.html">sensoryintelligencelab.com</a>
</footer>

<script>

let audioContext
let oscillator
let gainNode

const playBtn = document.getElementById("playBtn")
const stopBtn = document.getElementById("stopBtn")

const freqInput = document.getElementById("freqInput")
const freqSlider = document.getElementById("freqSlider")

const waveformSelect = document.getElementById("waveformSelect")
const gainSlider = document.getElementById("gainSlider")

function startOscillator() {

    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)()
    }

    oscillator = audioContext.createOscillator()
    gainNode = audioContext.createGain()

    oscillator.type = waveformSelect.value
    oscillator.frequency.value = parseFloat(freqInput.value)

    gainNode.gain.value = parseFloat(gainSlider.value)

    oscillator.connect(gainNode)
    gainNode.connect(audioContext.destination)

    oscillator.start()

    playBtn.classList.add("active")
    stopBtn.classList.remove("active")

}

function stopOscillator() {

    if (oscillator) {
        oscillator.stop()
        oscillator.disconnect()
        oscillator = null
    }

    stopBtn.classList.add("active")
    playBtn.classList.remove("active")

}

playBtn.addEventListener("click", startOscillator)
stopBtn.addEventListener("click", stopOscillator)

function updateFrequency(value) {

    value = Math.max(20, Math.min(20000, value))

    freqInput.value = value
    freqSlider.value = value

    if (oscillator) {
        oscillator.frequency.setValueAtTime(value, audioContext.currentTime)
    }

}

freqSlider.addEventListener("input", e => {
    updateFrequency(parseFloat(e.target.value))
})

freqInput.addEventListener("input", e => {
    updateFrequency(parseFloat(e.target.value))
})

document.getElementById("freqPlus").addEventListener("click", () => {
    updateFrequency(parseFloat(freqInput.value) + 1)
})

document.getElementById("freqMinus").addEventListener("click", () => {
    updateFrequency(parseFloat(freqInput.value) - 1)
})

waveformSelect.addEventListener("change", () => {

    if (oscillator) {
        oscillator.type = waveformSelect.value
    }

})

gainSlider.addEventListener("input", () => {

    if (gainNode) {
        gainNode.gain.setValueAtTime(
            parseFloat(gainSlider.value),
            audioContext.currentTime
        )
    }

})

function toggleSection(section) {

    const header = section.querySelector(".collapsible-header")

    if (section.classList.contains("open")) {
        section.classList.remove("open")
        header.textContent = header.textContent.replace("▾", "▸")
    } else {
        section.classList.add("open")
        header.textContent = header.textContent.replace("▸", "▾")
    }

}

const sections = document.querySelectorAll(".collapsible")

sections.forEach(section => {

    const header = section.querySelector(".collapsible-header")

    header.addEventListener("click", () => {
        toggleSection(section)
    })

})

</script>

  <footer class="site-footer">
  <a href="https://jordanelias.de" target="_blank" rel="noopener">
    jordanelias.de
  </a>
</footer>

  
</body>
</html>
